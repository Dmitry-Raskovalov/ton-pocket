<body class="flex flex-col min-h-screen items-center overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full max-w-[480px] sticky top-0 z-50 bg-[#111317] flex justify-between items-center px-6 py-4">

<span class="text-[10px] font-extrabold tracking-widest text-[#F59E0B] bg-[#451A03] px-2 py-0.5 rounded-sm uppercase">Testnet</span>
<span class="material-symbols-outlined text-gray-500 hover:opacity-80 transition-opacity cursor-pointer active:scale-95 duration-150" data-icon="settings">settings</span>

<div class="relative flex items-center justify-center w-24 h-24 rounded-xl bg-surface-container border border-white/5 shadow-2xl">

</div>
</div>
<!-- Typography Cluster -->
<div class="text-center space-y-4">
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface">

            </h1>
<p class="text-on-surface-variant font-medium text-sm leading-relaxed max-w-[280px] mx-auto">

            </p>
</div>
<!-- Technical Metadata (Asymmetric Layout Detail) -->
<div class="mt-16 w-full grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-4 rounded-lg border-l-2 border-primary/20">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant mb-1 font-bold">Network</p>
<p class="text-xs font-mono text-primary">testnet-v4.ton.org</p>
</div>
<div class="bg-surface-container-low p-4 rounded-lg border-l-2 border-tertiary/20">

<p class="text-xs font-mono text-tertiary">ADNL/UDP</p>
</div>
</div>
</main>

<button class="w-full machined-sheen text-on-primary-fixed py-4 rounded-xl font-bold tracking-tight active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="add_circle">add_circle</span>

        </button>
