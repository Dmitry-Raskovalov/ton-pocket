<body class="min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col bg-background relative pb-24">
<!-- Header Section -->
<header class="sticky top-0 z-50 bg-[#111317] flex justify-between items-center px-6 py-4 w-full">
<button class="flex items-center text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<div class="bg-tertiary-container px-2 py-0.5 rounded-sm">
<span class="text-[10px] font-bold tracking-widest text-on-tertiary-fixed-variant uppercase">Testnet</span>
</div>
<button class="text-gray-500 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</header>
<main class="flex-1 px-6 pt-4 space-y-8">
<!-- Title Section -->
<section>
<h2 class="text-2xl font-bold tracking-tight text-on-surface font-headline uppercase">Settings</h2>
</section>
<!-- Wallet Info Card -->
<section class="bg-surface-container rounded-xl p-5 space-y-6">
<div class="flex items-start justify-between">
<div class="space-y-1">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-medium">Wallet Architecture</p>
<h3 class="text-xl font-bold text-on-surface">v4R2</h3>
</div>
<div class="text-right space-y-1">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-medium">Network</p>
<p class="text-sm font-semibold text-tertiary">TON Testnet</p>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-4 group cursor-pointer hover:bg-surface-container-high transition-colors">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-medium mb-2">Address</p>
<div class="flex items-center justify-between gap-4">
<p class="ton-address-font text-sm break-all leading-relaxed">
<span class="text-on-surface font-bold">UQBx</span><span class="text-on-surface-variant opacity-40">...</span><span class="text-on-surface font-bold">7f2K</span>
</p>
<span class="material-symbols-outlined text-primary text-xl">content_copy</span>
</div>
</div>
</section>
<!-- Security Section -->
<section class="space-y-3">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold ml-1">Security &amp; Access</p>
<div class="bg-surface-container rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-high transition-colors border-b border-white/5 active:scale-[0.98] duration-150">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">shield</span>
</div>
<span class="font-medium text-on-surface">Export Recovery Phrase</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-5 hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-150">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">key</span>
</div>
<span class="font-medium text-on-surface">Change Password</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Danger Zone -->
<section class="space-y-3">
<p class="text-[10px] uppercase tracking-widest text-error font-bold ml-1">Danger Zone</p>
<div class="bg-surface-container rounded-xl overflow-hidden border border-error/20">
<button class="w-full flex items-center justify-between p-5 hover:bg-error-container/10 transition-colors group active:scale-[0.98] duration-150">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center text-error group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">delete</span>
</div>
<span class="font-bold text-error">Delete Wallet</span>
</div>
<span class="text-[10px] uppercase tracking-tighter text-error/40 font-bold group-hover:text-error transition-colors">Irreversible</span>
</button>
</div>
</section>
<!-- Metadata Footer -->
<footer class="pt-8 pb-12 text-center space-y-2 opacity-30">
<p class="text-[10px] uppercase tracking-[0.2em] font-bold">TON WALLET ENGINE v1.28.4</p>
<p class="text-[10px]">Environment: testnet-global-1</p>
