<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Import Wallet - Select Version</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed": "#d2e4ff",
              "tertiary": "#ffb955",
              "outline": "#8b919c",
              "on-surface": "#e2e2e6",
              "on-secondary-fixed": "#141c2a",
              "secondary": "#bfc6db",
              "tertiary-fixed-dim": "#ffb955",
              "surface-container-highest": "#333538",
              "on-tertiary-fixed": "#291800",
              "on-primary-fixed": "#001c37",
              "secondary-container": "#41495a",
              "surface": "#111317",
              "on-error": "#690005",
              "surface-container": "#1e2023",
              "primary-fixed-dim": "#a0caff",
              "tertiary-fixed": "#ffddb4",
              "surface-container-high": "#282a2d",
              "inverse-on-surface": "#2f3034",
              "on-secondary": "#283140",
              "primary": "#a0caff",
              "on-surface-variant": "#c1c7d2",
              "surface-variant": "#333538",
              "surface-container-low": "#1a1c1f",
              "on-tertiary-fixed-variant": "#633f00",
              "background": "#111317",
              "error": "#ffb4ab",
              "inverse-primary": "#0061a5",
              "on-tertiary-container": "#3c2500",
              "on-error-container": "#ffdad6",
              "tertiary-container": "#c68200",
              "surface-tint": "#a0caff",
              "on-primary-container": "#002b4e",
              "outline-variant": "#414751",
              "on-background": "#e2e2e6",
              "error-container": "#93000a",
              "surface-container-lowest": "#0c0e11",
              "secondary-fixed-dim": "#bfc6db",
              "on-secondary-fixed-variant": "#3f4757",
              "on-primary": "#003259",
              "surface-bright": "#37393d",
              "on-tertiary": "#452b00",
              "surface-dim": "#111317",
              "primary-container": "#4f94dd",
              "secondary-fixed": "#dbe2f7",
              "inverse-surface": "#e2e2e6",
              "on-primary-fixed-variant": "#00497e",
              "on-secondary-container": "#b0b8cc"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mono-address {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container/30">
<div class="min-h-screen max-w-[480px] mx-auto flex flex-col relative overflow-hidden">
<header class="bg-[#1E2023] dark:bg-[#1E2023] flex justify-between items-center w-full px-6 py-4 max-w-[480px] mx-auto sticky top-0 z-50 no-border bg-gradient-to-b from-[#1E2023] to-transparent">
<button class="text-[#4A90D9] dark:text-[#a0caff] hover:bg-[#333538] transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] uppercase tracking-[0.05em] text-sm font-bold text-[#4A90D9] dark:text-[#a0caff]">Select Wallet Version</h1>
<div class="px-2 py-0.5 bg-tertiary-container rounded-sm">
<span class="text-[10px] font-bold text-on-tertiary-container tracking-wider">TESTNET</span>
</div>
</header>
<main class="flex-grow px-6 pt-8 pb-32">
<div class="mb-10">
<h2 class="text-2xl font-extrabold tracking-tight mb-3">Found multiple wallets</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">Multiple wallets found for this phrase. Select one to proceed with the import process.</p>
</div>
<div class="space-y-4">
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="wallet_version" type="radio" value="v4r2"/>
<div class="p-5 rounded-xl bg-surface-container border-2 border-transparent transition-all duration-200 peer-checked:border-primary-container peer-checked:bg-surface-container-high group-hover:bg-surface-container-high shadow-sm">
<div class="flex justify-between items-start mb-4">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-lg font-bold">v4R2</span>
<span class="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 bg-primary/10 text-primary rounded-sm">Recommended</span>
</div>
<code class="mono-address text-xs text-on-surface-variant">
<span class="text-on-surface font-semibold">EQC8</span>...<span class="text-on-surface font-semibold">yZ1p</span>
</code>
</div>
<div class="text-right">
<div class="text-xl font-bold tracking-tighter">5.23 TON</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-widest">Available Balance</div>
</div>
</div>
<div class="flex items-center justify-end">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</div>
</label>
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="wallet_version" type="radio" value="v3r2"/>
<div class="p-5 rounded-xl bg-surface-container border-2 border-transparent transition-all duration-200 peer-checked:border-primary-container peer-checked:bg-surface-container-high group-hover:bg-surface-container-high shadow-sm">
<div class="flex justify-between items-start mb-4">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-lg font-bold">v3R2</span>
</div>
<code class="mono-address text-xs text-on-surface-variant">
<span class="text-on-surface font-semibold">EQDx</span>...<span class="text-on-surface font-semibold">mK9l</span>
</code>
</div>
<div class="text-right">
<div class="text-xl font-bold tracking-tighter">0.00 TON</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-widest">Legacy Version</div>
</div>
</div>
<div class="flex items-center justify-end">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</div>
</label>
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="wallet_version" type="radio" value="v5r1"/>
<div class="p-5 rounded-xl bg-surface-container border-2 border-transparent transition-all duration-200 peer-checked:border-primary-container peer-checked:bg-surface-container-high group-hover:bg-surface-container-high shadow-sm">
<div class="flex justify-between items-start mb-4">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-lg font-bold">v5R1</span>
<span class="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 bg-tertiary/10 text-tertiary rounded-sm">BETA</span>
</div>
<code class="mono-address text-xs text-on-surface-variant">
<span class="text-on-surface font-semibold">UQAf</span>...<span class="text-on-surface font-semibold">rW2q</span>
</code>
</div>
<div class="text-right">
<div class="text-xl font-bold tracking-tighter">1.12 TON</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-widest">W5 Smart Wallet</div>
</div>
</div>
<div class="flex items-center justify-end">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</div>
</label>
</div>
</main>
<footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 bg-gradient-to-t from-background via-background to-transparent pt-12">
<button class="w-full py-4 bg-primary-fixed-dim text-on-primary-fixed font-bold rounded-lg shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 bg-gradient-to-br from-primary to-primary-container">
                Continue
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<div class="absolute -top-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-tertiary/5 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</body></html>
