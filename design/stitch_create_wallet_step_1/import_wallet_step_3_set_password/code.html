<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#c1c7d2",
              "on-secondary": "#283140",
              "tertiary": "#ffb955",
              "on-tertiary-container": "#3c2500",
              "on-primary-container": "#002b4e",
              "on-surface": "#e2e2e6",
              "inverse-primary": "#0061a5",
              "primary": "#a0caff",
              "outline-variant": "#414751",
              "secondary-fixed": "#dbe2f7",
              "on-error-container": "#ffdad6",
              "background": "#111317",
              "on-secondary-fixed-variant": "#3f4757",
              "surface": "#111317",
              "on-primary-fixed-variant": "#00497e",
              "surface-container": "#1e2023",
              "on-secondary-container": "#b0b8cc",
              "error": "#ffb4ab",
              "primary-fixed-dim": "#a0caff",
              "on-secondary-fixed": "#141c2a",
              "surface-container-high": "#282a2d",
              "secondary": "#bfc6db",
              "primary-container": "#4f94dd",
              "on-tertiary-fixed": "#291800",
              "surface-tint": "#a0caff",
              "on-tertiary-fixed-variant": "#633f00",
              "tertiary-fixed": "#ffddb4",
              "surface-dim": "#111317",
              "on-primary-fixed": "#001c37",
              "on-primary": "#003259",
              "surface-container-low": "#1a1c1f",
              "tertiary-container": "#c68200",
              "surface-variant": "#333538",
              "surface-container-lowest": "#0c0e11",
              "on-tertiary": "#452b00",
              "primary-fixed": "#d2e4ff",
              "tertiary-fixed-dim": "#ffb955",
              "outline": "#8b919c",
              "error-container": "#93000a",
              "surface-bright": "#37393d",
              "on-error": "#690005",
              "secondary-container": "#41495a",
              "inverse-on-surface": "#2f3034",
              "secondary-fixed-dim": "#bfc6db",
              "on-background": "#e2e2e6",
              "surface-container-highest": "#333538",
              "inverse-surface": "#e2e2e6"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #111317;
        color: #e2e2e6;
        font-family: 'Inter', sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .ghost-border {
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      .primary-gradient {
        background: linear-gradient(135deg, #a0caff 0%, #4f94dd 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center min-h-screen">
<main class="w-full max-w-[480px] bg-background min-h-screen relative flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 max-w-[480px] mx-auto bg-[#1E2023] no-border">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#4A90D9]" data-icon="account_balance_wallet">account_balance_wallet</span>
<h1 class="font-['Inter'] uppercase tracking-widest text-xs font-bold text-white">TON WALLET</h1>
</div>
<div class="px-2 py-0.5 bg-tertiary-container rounded-sm">
<span class="font-['Inter'] text-[10px] font-black tracking-tighter text-on-tertiary-fixed-variant">TESTNET</span>
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 mt-14 px-6 pt-10 pb-24 overflow-y-auto no-scrollbar">
<!-- Header Section -->
<section class="mb-10">
<h2 class="text-2xl font-extrabold tracking-tight text-on-surface mb-2">Set Password</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">Protect your imported wallet with a password</p>
</section>
<!-- Form Module -->
<div class="space-y-8">
<!-- Password Field 1 -->
<div class="space-y-3">
<label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">New Password</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-lg h-14 px-4 text-on-surface placeholder:text-surface-variant focus:ring-1 focus:ring-primary-container focus:bg-surface-container-high transition-all outline-none font-mono" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Strength Indicator -->
<div class="flex items-center gap-2 px-1">
<div class="flex-1 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-tertiary"></div>
</div>
<span class="text-[10px] font-bold text-tertiary uppercase tracking-tight">Medium</span>
</div>
</div>
<!-- Password Field 2 -->
<div class="space-y-3">
<label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1">Confirm Password</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-lg h-14 px-4 text-on-surface placeholder:text-surface-variant focus:ring-1 focus:ring-primary-container focus:bg-surface-container-high transition-all outline-none font-mono" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Info Box (Editorial/Technical feel) -->
<div class="p-4 bg-surface-container-low rounded-lg border-l-2 border-primary-container flex gap-3">
<span class="material-symbols-outlined text-primary-container text-xl" data-icon="info">info</span>
<p class="text-xs text-on-surface-variant leading-relaxed">
                        Your password encrypts your private keys locally. We cannot recover it if lost. Store your recovery phrase safely.
                    </p>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<footer class="fixed bottom-0 w-full max-w-[480px] p-6 bg-background/80 backdrop-blur-xl">
<button class="w-full h-14 primary-gradient rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-primary/10">
<span class="font-bold text-on-primary uppercase tracking-widest text-sm">Continue</span>
<span class="material-symbols-outlined text-on-primary text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
</body></html>
