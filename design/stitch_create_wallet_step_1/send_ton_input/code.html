<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-gradient-btn {
      background: linear-gradient(135deg, #a0caff 0%, #4f94dd 100%);
    }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body min-h-screen">
<main class="max-w-[480px] mx-auto min-h-screen flex flex-col relative bg-surface-container-low">
<!-- Header -->
<header class="flex justify-between items-center px-6 py-4 sticky top-0 z-10 bg-surface-container-low/80 backdrop-blur-md">
<button class="flex items-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Mandatory Testnet Badge -->
<div class="bg-tertiary-container px-2 py-0.5 rounded-sm">
<span class="text-on-tertiary-fixed-variant font-label text-[10px] font-extrabold uppercase tracking-widest">Testnet</span>
</div>
</header>
<!-- Content Canvas -->
<div class="px-6 pt-2 pb-24 flex-1">
<!-- Page Title & Balance Section -->
<div class="mb-10">
<h1 class="text-3xl font-headline font-bold tracking-tight text-on-surface mb-2">Send TON</h1>
<div class="flex items-center gap-2">
<span class="text-on-surface-variant text-sm font-medium">Available:</span>
<span class="text-primary font-mono text-sm font-bold">5.230 TON</span>
</div>
</div>
<!-- Form Modules -->
<div class="space-y-8">
<!-- Recipient Address Input -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-[0.1em] text-on-surface-variant px-1">Recipient Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none rounded-xl p-4 text-on-surface font-mono placeholder:text-outline-variant focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="UQ..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px] cursor-pointer hover:text-primary">qr_code_scanner</span>
</div>
</div>
</div>
<!-- Amount Input -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-[0.1em] text-on-surface-variant px-1">Amount</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-xl p-4 pr-20 text-on-surface font-headline font-bold text-lg placeholder:text-outline-variant focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="0.00" type="number"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 bg-surface-container-highest px-3 py-1.5 rounded-lg text-[10px] font-bold text-primary hover:bg-primary hover:text-on-primary transition-all">
              MAX
            </button>
</div>
</div>
<!-- Comment Input -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-[0.1em] text-on-surface-variant px-1">Comment (optional)</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-xl p-4 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="Gift for a friend" type="text"/>
</div>
<p class="text-[10px] text-outline px-1 leading-relaxed">
            The comment will be visible to everyone on the blockchain.
          </p>
</div>
</div>
<!-- Asymmetric Decoration (Subtle Editoral Feel) -->
<div class="mt-12 p-6 rounded-xl bg-surface-container border border-white/5 relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-3xl -mr-16 -mt-16"></div>
<div class="flex items-start gap-4 relative z-10">
<span class="material-symbols-outlined text-tertiary mt-0.5">info</span>
<div class="space-y-1">
<h4 class="text-xs font-bold uppercase tracking-wider text-on-surface">Security Protocol</h4>
<p class="text-xs text-on-surface-variant leading-relaxed">
              Ensure the destination address is on the <span class="text-tertiary">TON Testnet</span>. Sending assets to a mainnet address may result in permanent loss.
            </p>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 bg-surface-container-low/90 backdrop-blur-md">
<button class="custom-gradient-btn w-full py-4 rounded-xl text-on-primary-fixed font-headline font-extrabold uppercase tracking-widest text-sm shadow-xl active:scale-[0.98] transition-transform">
        Continue
      </button>
</div>
</main>

</body></html>
