<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TON Testnet Wallet - Export Recovery Phrase</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed-variant": "#00497e",
                        "background": "#111317",
                        "surface": "#111317",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#bfc6db",
                        "outline-variant": "#414751",
                        "surface-variant": "#333538",
                        "on-tertiary-container": "#3c2500",
                        "surface-dim": "#111317",
                        "surface-container-lowest": "#0c0e11",
                        "surface-container-low": "#1a1c1f",
                        "surface-container-high": "#282a2d",
                        "surface-container": "#1e2023",
                        "on-surface-variant": "#c1c7d2",
                        "surface-tint": "#a0caff",
                        "on-secondary-fixed": "#141c2a",
                        "error": "#ffb4ab",
                        "tertiary": "#ffb955",
                        "primary": "#a0caff",
                        "on-tertiary": "#452b00",
                        "on-error": "#690005",
                        "on-secondary": "#283140",
                        "on-secondary-container": "#b0b8cc",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-primary-fixed": "#001c37",
                        "inverse-surface": "#e2e2e6",
                        "on-tertiary-fixed": "#291800",
                        "secondary-container": "#41495a",
                        "on-background": "#e2e2e6",
                        "tertiary-fixed-dim": "#ffb955",
                        "secondary": "#bfc6db",
                        "on-primary-container": "#002b4e",
                        "surface-container-highest": "#333538",
                        "inverse-primary": "#0061a5",
                        "tertiary-container": "#c68200",
                        "surface-bright": "#37393d",
                        "primary-fixed-dim": "#a0caff",
                        "on-surface": "#e2e2e6",
                        "error-container": "#93000a",
                        "secondary-fixed": "#dbe2f7",
                        "primary-container": "#4f94dd",
                        "on-secondary-fixed-variant": "#3f4757",
                        "outline": "#8b919c",
                        "on-primary": "#003259",
                        "inverse-on-surface": "#2f3034",
                        "tertiary-fixed": "#ffddb4",
                        "primary-fixed": "#d2e4ff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-shadow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary selection:text-on-primary">
<!-- App Container (480px Centered) -->
<div class="max-w-[480px] min-h-screen mx-auto relative bg-surface flex flex-col">
<!-- TopAppBar Shared Component -->
<header class="bg-[#111317] dark:bg-[#111317] flex justify-between items-center px-6 h-16 w-full max-w-[480px] mx-auto docked full-width top-0 sticky z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#4A90D9] dark:text-[#a0caff]" data-icon="security">security</span>
<span class="font-['Inter'] uppercase tracking-[0.05em] text-xs font-bold text-[#4A90D9] dark:text-[#a0caff]">TESTNET</span>
</div>
<span class="material-symbols-outlined text-[#333538] hover:bg-[#333538] transition-colors rounded-full p-1 cursor-pointer" data-icon="close">close</span>
</header>
<!-- Settings Background Content (Blurred Backdrop) -->
<main class="flex-1 px-6 pt-4 pb-24 space-y-6 overflow-hidden opacity-30 pointer-events-none">
<div class="h-12 w-full bg-surface-container rounded-lg"></div>
<div class="space-y-4">
<div class="h-16 w-full bg-surface-container rounded-lg"></div>
<div class="h-16 w-full bg-surface-container rounded-lg"></div>
<div class="h-16 w-full bg-surface-container rounded-lg"></div>
<div class="h-16 w-full bg-surface-container rounded-lg"></div>
</div>
</main>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-surface-container-low modal-shadow rounded-xl overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="px-6 py-5 flex justify-between items-start">
<h2 class="text-on-surface text-xl font-bold tracking-tight">Export Recovery Phrase</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-6 pb-8 space-y-6">
<p class="text-on-surface-variant text-sm leading-relaxed">
                        Enter your password to view the recovery phrase.
                    </p>
<!-- Warning Card -->
<div class="bg-error-container/20 border border-error/10 p-4 rounded-xl flex gap-3 items-start">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="text-on-error-container text-xs font-medium leading-tight">
                            NEVER share your recovery phrase with anyone. Anyone with these words can steal your funds.
                        </p>
</div>
<!-- Input Section -->
<div class="space-y-4">
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary rounded-lg px-4 py-4 text-on-surface placeholder:text-outline-variant font-mono text-sm transition-all" placeholder="Enter Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Checkbox -->
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded-sm bg-surface-container-high border-none text-primary focus:ring-0 focus:ring-offset-0" type="checkbox"/>
<span class="absolute text-on-primary opacity-0 peer-checked:opacity-100 left-0.5 pointer-events-none material-symbols-outlined text-sm" style="font-size: 16px;">check</span>
</div>
<span class="text-on-surface-variant text-sm group-hover:text-on-surface transition-colors">I understand the risks</span>
</label>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pt-2">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-lg opacity-50 cursor-not-allowed transition-all active:scale-95">
                            View Phrase
                        </button>
<button class="w-full text-primary font-bold py-4 rounded-lg hover:bg-surface-container-highest transition-colors active:scale-95">
                            Cancel
                        </button>
</div>
</div>
</div>
</div>
<!-- BottomNavBar Shared Component -->
<nav class="fixed bottom-0 left-0 right-0 flex justify-around items-center h-20 pb-safe max-w-[480px] mx-auto bg-[#1E2023]/80 dark:bg-[#1E2023]/80 backdrop-blur-md shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-40">
<div class="flex flex-col items-center justify-center text-[#333538] hover:text-white transition-all">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-tight">Wallet</span>
</div>
<div class="flex flex-col items-center justify-center text-[#333538] hover:text-white transition-all">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-tight">History</span>
</div>
<div class="flex flex-col items-center justify-center text-[#333538] hover:text-white transition-all">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-tight">Browser</span>
</div>
<div class="flex flex-col items-center justify-center text-[#a0caff] font-bold hover:text-white transition-all">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-tight">Settings</span>
</div>
</nav>
</div>
</body></html>
