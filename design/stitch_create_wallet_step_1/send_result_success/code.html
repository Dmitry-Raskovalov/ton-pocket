<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transaction Success - TON Wallet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#b0b8cc",
              "surface": "#111317",
              "surface-dim": "#111317",
              "on-primary-fixed-variant": "#00497e",
              "on-tertiary": "#452b00",
              "on-background": "#e2e2e6",
              "on-primary-fixed": "#001c37",
              "surface-container-lowest": "#0c0e11",
              "secondary-fixed": "#dbe2f7",
              "surface-variant": "#333538",
              "primary-fixed-dim": "#a0caff",
              "on-tertiary-container": "#3c2500",
              "primary-container": "#4f94dd",
              "on-tertiary-fixed-variant": "#633f00",
              "on-secondary-fixed": "#141c2a",
              "on-primary": "#003259",
              "tertiary": "#ffb955",
              "on-tertiary-fixed": "#291800",
              "secondary": "#bfc6db",
              "inverse-primary": "#0061a5",
              "outline-variant": "#414751",
              "on-error": "#690005",
              "outline": "#8b919c",
              "on-primary-container": "#002b4e",
              "on-surface-variant": "#c1c7d2",
              "primary": "#a0caff",
              "surface-container": "#1e2023",
              "secondary-fixed-dim": "#bfc6db",
              "surface-tint": "#a0caff",
              "surface-container-high": "#282a2d",
              "tertiary-fixed-dim": "#ffb955",
              "error": "#ffb4ab",
              "on-surface": "#e2e2e6",
              "inverse-on-surface": "#2f3034",
              "primary-fixed": "#d2e4ff",
              "on-error-container": "#ffdad6",
              "tertiary-container": "#c68200",
              "surface-container-low": "#1a1c1f",
              "on-secondary-fixed-variant": "#3f4757",
              "inverse-surface": "#e2e2e6",
              "surface-container-highest": "#333538",
              "tertiary-fixed": "#ffddb4",
              "background": "#111317",
              "secondary-container": "#41495a",
              "on-secondary": "#283140",
              "error-container": "#93000a",
              "surface-bright": "#37393d"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .font-mono-data {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary min-h-screen flex flex-col">
<!-- Top Navigation Anchor -->
<header class="bg-[#111317] dark:bg-[#111317] docked full-width top-0 sticky z-50">
<div class="flex justify-between items-center max-w-[480px] mx-auto px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#4A90D9] dark:text-[#a0caff]" data-icon="account_balance_wallet">account_balance_wallet</span>
<h1 class="font-['Inter'] tracking-tight font-bold uppercase text-xs text-white">TON Wallet</h1>
</div>
<div class="flex items-center gap-3">
<span class="text-sm font-bold tracking-widest text-[#F59E0B] bg-[#451A03] px-2 py-0.5 rounded-sm uppercase">Testnet</span>
<span class="material-symbols-outlined text-gray-500 hover:opacity-80 transition-opacity cursor-pointer" data-icon="settings">settings</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center max-w-[480px] mx-auto w-full px-6 py-8">
<!-- Success State Visualization -->
<div class="w-full flex flex-col items-center space-y-8">
<!-- Animated Success Mark Container -->
<div class="relative">
<div class="w-24 h-24 rounded-full bg-primary-container/20 flex items-center justify-center">
<div class="w-20 h-20 rounded-full bg-primary-container/40 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Header Editorial -->
<div class="text-center space-y-2">
<h2 class="text-3xl font-extrabold tracking-tight text-on-background">Transaction Sent!</h2>
<p class="text-on-surface-variant font-medium max-w-[280px] mx-auto leading-relaxed">
                    2.500 TON sent to <span class="font-mono-data text-on-surface">UQBx...7f2K</span>
</p>
</div>
<!-- Detailed Module Card -->
<div class="w-full space-y-5">
<!-- Transaction Info Module -->
<div class="bg-surface-container rounded-xl p-5 space-y-4 border border-white/[0.03]">
<div class="flex justify-between items-center">
<span class="text-[10px] uppercase tracking-widest font-bold text-outline">Status</span>
<span class="text-xs font-bold text-primary px-2 py-1 bg-primary/10 rounded uppercase">Confirmed</span>
</div>
<div class="space-y-1.5">
<span class="text-[10px] uppercase tracking-widest font-bold text-outline">Transaction Hash</span>
<div class="flex items-center justify-between bg-surface-container-lowest rounded p-3 group hover:bg-surface-container-high transition-colors">
<code class="text-xs font-mono-data text-on-surface-variant break-all leading-tight pr-4">TX: a3f2...9k1m</code>
<button class="text-primary hover:text-white transition-colors flex-shrink-0 active:scale-90 duration-150">
<span class="material-symbols-outlined text-lg" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>
</div>
<!-- Network Fee Metadata -->
<div class="px-5 flex justify-between items-center text-[11px] font-medium text-outline">
<span>Network Fee</span>
<span class="font-mono-data text-on-surface-variant">0.0035 TON</span>
</div>
</div>
<!-- Action Cluster -->
<div class="w-full pt-4 space-y-3">
<button class="w-full py-4 px-6 bg-primary-fixed-dim hover:opacity-90 active:scale-[0.98] transition-all duration-200 rounded-xl flex items-center justify-center gap-2 group shadow-[0_4px_20px_rgba(0,0,0,0.3)]">
<span class="text-on-primary-fixed font-bold tracking-tight">Back to Wallet</span>
<span class="material-symbols-outlined text-on-primary-fixed text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full py-3 px-6 text-on-surface-variant hover:text-white text-xs font-bold uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="open_in_new">open_in_new</span>
                    View on Explorer
                </button>
</div>
</div>
</main>
<!-- Navigation Shell Placeholder (Suppressed for focused Transaction Success screen) -->
<!-- The BottomNavBar is hidden here to focus on the transaction outcome action -->
<!-- Decorative Aesthetic Glow -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] h-[300px] pointer-events-none -z-10 overflow-hidden">
<div class="absolute bottom-[-150px] left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-primary/10 blur-[100px] rounded-full"></div>
</div>
</body></html>
