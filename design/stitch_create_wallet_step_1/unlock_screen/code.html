<style>
        body {
            background-color: #111317;
            font-family: 'Inter', sans-serif;
            color: #e2e2e6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            background-color: rgba(30, 32, 35, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface antialiased">
<!-- Shell Container -->
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar (From Shared Components) -->
<header class="fixed top-0 w-full z-50 bg-[#111317] dark:bg-[#111317] flex justify-between items-center px-6 h-16 max-w-[480px] mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-blue-400" data-icon="lock">lock</span>
<h1 class="font-['Inter'] tracking-tight text-sm uppercase font-bold text-white uppercase tracking-widest text-lg">Wallet</h1>
</div>
<!-- Mandatory Testnet Badge -->
<div class="bg-tertiary-container px-3 py-1 rounded-[4px] flex items-center justify-center">
<span class="text-[10px] font-bold tracking-widest text-on-tertiary-fixed-variant uppercase">TESTNET</span>
</div>
</header>
<!-- Main Content (Centered Canvas) -->
<main class="flex-grow flex flex-col items-center justify-center px-8 pt-20 pb-12">
<!-- Lock Visual Anchor -->
<div class="mb-8 relative">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<!-- Ambient Glow behind the icon -->
<div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full scale-150"></div>
</div>
<!-- Typography Header -->
<div class="text-center mb-10">
<h2 class="text-2xl font-extrabold tracking-tight mb-2 text-on-surface">TON Testnet Wallet</h2>
<p class="text-on-surface-variant text-sm font-medium leading-relaxed max-w-[240px] mx-auto">
                    Enter your password to unlock the wallet.
                </p>
</div>
<!-- Form Module -->
<div class="w-full space-y-6">
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">Password</label>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 focus:ring-primary focus:bg-surface-container-high transition-all duration-200 rounded-xl px-4 py-4 text-on-surface placeholder:text-outline/50 font-medium" placeholder="Enter password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full py-4 px-6 rounded-xl bg-primary-fixed-dim text-on-primary-fixed font-bold text-sm uppercase tracking-widest shadow-lg shadow-primary/5 hover:brightness-110 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2">
                    Unlock
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Editorial Secondary Action -->
<div class="pt-4 text-center">
<button class="text-[11px] font-bold uppercase tracking-widest text-outline hover:text-primary transition-colors">
                        Forgot Password?
                    </button>
</div>
</div>
</main>
<!-- Decoration / Background Textures (No-Line Rule) -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none -mr-32 -mt-32"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 bg-tertiary-container/5 rounded-full blur-[100px] pointer-events-none -ml-32 -mb-32"></div>
<!-- System Footer -->
<footer class="p-6 text-center">
<p class="text-[10px] font-mono text-outline/40 tracking-tighter uppercase">
                v5.4.0 • Secure Encryption Active
            </p>
</footer>
</div>
<!-- Hidden Bottom Nav for top-level destination check (Suppressed based on Transactional Rule) -->
<!-- The BottomNavBar is suppressed here because this is a focused Task/Lock screen -->
</body></html>
